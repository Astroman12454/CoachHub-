databases:
  - name: coach-hub-db
    plan: free

services:
  - type: web
    name: coach-hub
    env: node
    plan: free
    buildCommand: npm install && npm run build
    preDeployCommand: npm run db:push
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: coach-hub-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      # Billing (Stripe) — optional. Leave unset and the app runs fine on
      # the free plan only; see server/scripts/setup-stripe.ts.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # AI box-score import — optional. Leave unset and manual game entry
      # still works; only the photo/PDF import button is disabled.
      - key: ANTHROPIC_API_KEY
        sync: false
