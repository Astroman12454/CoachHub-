databases:
  - name: coach-hub-db
    plan: free

services:
  - type: web
    name: coach-hub
    env: node
    plan: free
    # preDeployCommand isn't available on the free plan, so the migration
    # runs as the last build step instead — same effect (it just applies
    # any pending migrations in migrations/ against DATABASE_URL, already
    # set below by the time this runs), only downside is it can't run in
    # parallel with the previous instance staying up during a paid-plan
    # zero-downtime deploy. Fine for a single free instance.
    #
    # db:migrate (drizzle-kit migrate), not db:push: push diffs the live
    # database against schema.ts on every deploy and can hit an
    # interactive "this may lose data, truncate? y/n" prompt with no way
    # to answer it in a non-interactive build step — a deploy would just
    # hang. migrate instead replays the versioned, reviewed SQL files
    # already committed in migrations/ (see that folder's own note on
    # adding a new one), so what runs in production is exactly what was
    # tested locally — no live schema diffing, no surprise prompts.
    #
    # --include=dev is required: with NODE_ENV=production set below, a
    # plain `npm install` silently skips devDependencies — which is
    # where vite, esbuild, and drizzle-kit live, all needed right here
    # to build and migrate (only the built output needs to run without
    # them, at startCommand time).
    buildCommand: npm install --include=dev && npm run build && npm run db:migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: coach-hub-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      # Billing (Stripe) — optional. Leave unset and the app runs fine on
      # the free plan only; see server/scripts/setup-stripe.ts.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID_PAID_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ID_PAID_ANNUAL
        sync: false
      - key: STRIPE_PRICE_ID_CLUB_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ID_CLUB_ANNUAL
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # AI box-score import — optional. Leave unset and manual game entry
      # still works; only the photo/PDF import button is disabled.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Push notifications (session/game reminders to players who opted in
      # from their portal link) — optional. Leave unset and the app runs
      # fine; the "enable notifications" button just stays hidden on the
      # portal. Generate a key pair once with:
      #   npx web-push generate-vapid-keys
      # VAPID_SUBJECT must be a mailto: address or https:// URL.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Transactional email (Resend) — optional, used for "forgot password"
      # and the weekly digest email. Leave unset and reset-password returns
      # a 503; the digest just skips the email leg. Create an API key at
      # resend.com and verify a sending domain there.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # Automatic session reminders + weekly digest — optional, replaces
      # the manual "Notify" button. This free plan sleeps the whole process
      # after inactivity, so the in-process scheduler alone isn't reliable;
      # after setting CRON_SECRET, also add a free external pinger (e.g.
      # cron-job.org) hitting this service's
      # POST /api/cron/notifications every ~15 min with header
      # `x-cron-secret: <CRON_SECRET>`. Leave CRON_SECRET unset and that
      # endpoint just 503s — the in-process scheduler still runs whenever
      # the dyno happens to be awake.
      - key: CRON_SECRET
        sync: false
      - key: APP_URL
        value: https://coach-hub-g99u.onrender.com
      # Production error monitoring (Sentry) — optional. Leave unset and
      # the app runs exactly as before (server errors only go to stdout,
      # client crashes only show ErrorBoundary's fallback UI). Create a
      # free project at sentry.io for a DSN. VITE_SENTRY_DSN must be set
      # *before* buildCommand runs above (Vite inlines it into the client
      # bundle at build time) — setting it here does that, since Render
      # exposes every envVar to the build step too, not just at runtime.
      - key: SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
